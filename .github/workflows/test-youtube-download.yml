name: ORBIT web YouTube download tests

on:
  push:
    branches:
      - test/ytdlp-web-downloads-20261114
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check server.mjs
          node --check app.js
          node --check youtube-download.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install yt-dlp dependency
        run: |
          python -m pip install --disable-pip-version-check -r requirements-download.txt
          yt-dlp --version
      - name: Run tests
        run: node --test
