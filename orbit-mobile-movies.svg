<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560">
<defs>
 <linearGradient id="mov-screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a1518"/><stop offset="1" stop-color="#0e0708"/></linearGradient>
 <linearGradient id="mov-art" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f43f5e"/><stop offset="1" stop-color="#be123c"/></linearGradient>
 <filter id="mov-shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<ellipse cx="380" cy="490" rx="230" ry="32" fill="#000" opacity=".35" filter="url(#mov-shadow)"/>
<g transform="translate(230 25)">
 <rect x="0" y="0" width="300" height="500" rx="42" fill="#0d0708" stroke="#523237" stroke-width="4"/>
 <rect x="14" y="14" width="272" height="472" rx="32" fill="url(#mov-screen)"/>
 <rect x="102" y="22" width="96" height="16" rx="8" fill="#080405"/>
 <text x="32" y="58" fill="#ffe4e6" font-size="12" font-family="system-ui, -apple-system, sans-serif">9:41</text>
 <text x="32" y="100" fill="#fff1f2" font-size="22" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Cinema &amp; TV</text>
 <text x="32" y="122" fill="#fda4af" font-size="12" font-family="system-ui, -apple-system, sans-serif">Top rated films &amp; live channels</text>

 <!-- Movie poster spotlight card -->
 <rect x="28" y="145" width="244" height="160" rx="16" fill="url(#mov-art)"/>
 <rect x="44" y="160" width="80" height="110" rx="8" fill="#1c1917" opacity=".4"/>
 <circle cx="84" cy="215" r="18" fill="#fff" opacity=".8"/>
 <path d="M80 207 L91 215 L80 223 Z" fill="#be123c"/>
 <text x="136" y="180" fill="#ffffff" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Interstellar</text>
 <text x="136" y="198" fill="#fecdd3" font-size="11" font-family="system-ui, -apple-system, sans-serif">Sci-Fi · 2h 49m</text>
 <text x="136" y="218" fill="#fbbf24" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif">★ 8.7 / 10</text>
 <rect x="136" y="235" width="85" height="26" rx="6" fill="#ffffff"/>
 <text x="148" y="252" fill="#9f1239" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Watch Trailer</text>

 <!-- Movie category badges -->
 <g font-family="system-ui, -apple-system, sans-serif" font-size="11">
  <rect x="28" y="322" width="70" height="28" rx="14" fill="#3f1d24" stroke="#881337" stroke-width="1"/>
  <text x="44" y="340" fill="#fecdd3">Action</text>
  <rect x="106" y="322" width="76" height="28" rx="14" fill="#3f1d24" stroke="#881337" stroke-width="1"/>
  <text x="120" y="340" fill="#fecdd3">Drama</text>
  <rect x="190" y="322" width="82" height="28" rx="14" fill="#3f1d24" stroke="#881337" stroke-width="1"/>
  <text x="204" y="340" fill="#fecdd3">Comedy</text>
 </g>

 <!-- Movie row item -->
 <rect x="28" y="365" width="244" height="50" rx="10" fill="#241014" stroke="#4c1d24" stroke-width="1"/>
 <rect x="36" y="372" width="36" height="36" rx="6" fill="#be123c"/>
 <text x="82" y="392" fill="#fff1f2" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">The Dark Knight</text>
 <text x="82" y="408" fill="#fb7185" font-size="10" font-family="system-ui, -apple-system, sans-serif">Action · ★ 9.0</text>

 <rect x="28" y="425" width="244" height="50" rx="10" fill="#241014" stroke="#4c1d24" stroke-width="1"/>
 <rect x="36" y="432" width="36" height="36" rx="6" fill="#9f1239"/>
 <text x="82" y="452" fill="#fff1f2" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Inception</text>
 <text x="82" y="468" fill="#fb7185" font-size="10" font-family="system-ui, -apple-system, sans-serif">Adventure · ★ 8.8</text>
</g>
</svg>